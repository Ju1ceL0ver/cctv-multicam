<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка людей</title><link rel="stylesheet" href="/static/review.css"></head>
<body><header><div class="top"><strong>Проверка людей</strong><select id="clip" aria-label="Запись"></select><a id="videoEditorLink" href="/video" style="color:var(--accent)">Исправлять на видео</a><a href="/visits" style="color:var(--accent)">Связи между записями</a><button id="undo" disabled>Отменить · Z</button></div><div class="progress"><progress id="progress" max="1" value="0"></progress><span id="progressText"></span></div><div class="toolbar"><label><input type="checkbox" id="onlyNew" checked> Только непроверенные</label><label>Порядок <select id="order"><option value="time">По времени</option><option value="long">Длинные группы сначала</option></select></label><span id="sync" class="muted"></span></div></header>
<main><div id="notice" role="status" aria-live="polite"></div><section id="content" aria-busy="true">Загрузка…</section></main>
<dialog id="player"><div class="top"><strong>Контекст отрезка</strong><button id="closeVideo">Закрыть</button></div><p class="muted">Время относится к исходной записи камеры. Зелёный контур показывает выбранную детекцию.</p><div id="videos"></div><div id="pairActions" class="actions" hidden><button data-decision="same">Тот же человек</button><button data-decision="different">Разные люди</button><button data-decision="unsure">Не уверен</button></div></dialog>
<script src="/static/review.js"></script></body></html>
