<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Внутри или снаружи</title><link rel="stylesheet" href="/static/review.css">
<style>
#stage{display:flex;gap:12px;margin-top:8px;align-items:flex-start;flex-wrap:wrap}
#cropbox{position:relative;background:#0b0f13;border-radius:10px;overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-width:220px;height:64vh}
#crop{height:100%;display:block}
#side{flex:1 1 320px;min-width:280px;max-width:640px}
#frame{width:100%;display:block;border-radius:8px;background:#0b0f13}
#tag{position:absolute;left:8px;top:8px;background:#000a;color:#fff;padding:3px 8px;border-radius:6px;font:600 13px system-ui}
#given{position:absolute;right:8px;top:8px;background:#f5c542;color:#000;padding:3px 10px;border-radius:6px;font:800 16px system-ui;display:none}
.choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.choices button{text-align:left;padding:8px 10px;font-size:15px}
.choices b{font-size:20px;margin-right:8px}
.hint{margin-top:8px;font-size:13px}
#hist{font-variant-numeric:tabular-nums}
</style></head>
<body class="labeller">
<header><div class="top"><strong>Внутри или снаружи</strong><span id="progress" class="counter muted"></span>
<span class="spacer"></span><span id="hist" class="muted"></span></div>
<div id="notice" role="status"></div></header>
<main>
  <div id="stage">
    <div id="cropbox"><img id="crop" alt=""><span id="tag"></span><span id="given"></span></div>
    <div id="side">
      <img id="frame" alt="">
      <div class="choices">
        {% for k in [1, 2, 3, 4, 5, 0] %}<button onclick="give({{ k }})"><b>{{ k }}</b>{{ labels[k] }}</button>{% endfor %}
      </div>
      <div class="hint muted">Слева — ровно то, что увидит маленькая сеть: человек с запасом вокруг, без ступней и без
        всего кадра. Кадр справа — только для вас, чтобы ответить верно. Отвечайте по правде, а не по тому,
        видно ли это по вырезке.</div>
    </div>
  </div>
</main>
<div class="keybar">
  <button onclick="give(1)"><kbd>1</kbd>…<kbd>5</kbd>, <kbd>0</kbd>ответ</button>
  <button onclick="plain()"><kbd>H</kbd>без контура</button>
  <button onclick="undo()"><kbd>Z</kbd>отменить</button>
  <button onclick="back()"><kbd>←</kbd>назад</button><button onclick="fwd()"><kbd>→</kbd>дальше</button>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const NAMES = {{ labels | tojson }};
let todo = [], recent = [], given = {}, meta = {}, cur = null, viewing = null, noOutline = false, total = 0, done = 0, hist = {};
const outbox = [];
let sending = false, loaded = false;

async function refill() {
  const j = await (await fetch('/api/inout?n=200')).json();
  Object.assign(meta, j.meta);
  const seen = new Set([...recent, ...todo, cur].filter(Boolean));
  todo = todo.concat(j.todo.filter(i => !seen.has(i) && given[i] === undefined));
  if (!recent.length) { recent = j.recent; Object.assign(given, j.labels); }
  total = j.total;
  if (!loaded) { done = j.done; hist = j.hist; loaded = true; }   // afterwards counted here: a refill can overtake our last answers
  if (!cur) next();
  counters();
}
function counters() {
  $('#progress').textContent = `размечено ${done} из ${total}`;
  $('#hist').textContent = [1, 2, 3, 4, 5, 0].map(k => `${NAMES[k]}: ${hist[k] || 0}`).join(' · ');
}
function src(id) { return `/inout-img/${id}/${noOutline ? 'plain' : 'crop'}`; }
function show(id) {
  viewing = id;
  $('#crop').src = src(id);
  $('#frame').src = `/inout-img/${id}/frame`;
  const m = meta[id];
  $('#tag').textContent = m ? `${m.day.slice(6, 8)}.${m.day.slice(4, 6)} · ${m.cam === 'cam1' ? 'камера 1' : 'камера 2'}` : '';
  const g = given[id];
  $('#given').style.display = g === undefined ? 'none' : 'block';
  $('#given').textContent = g === undefined ? '' : NAMES[g];
  for (const n of todo.slice(0, 3)) { new Image().src = `/inout-img/${n}/crop`; new Image().src = `/inout-img/${n}/frame`; }
}
function next() {
  cur = todo.shift() || null;
  if (!cur) { $('#tag').textContent = 'Все размечены'; $('#crop').removeAttribute('src'); $('#frame').removeAttribute('src'); viewing = null; return; }
  show(cur);
  if (todo.length < 20) refill();
}
async function pump() {
  if (sending) return;
  sending = true;
  while (outbox.length) {
    const a = outbox[0];
    try {
      const r = await fetch('/api/inout', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(a)});
      if (r.status >= 400 && r.status < 500) { $('#notice').textContent = 'Не принято: ' + a.id; outbox.shift(); continue; }
      if (!r.ok) throw new Error(r.status);
      outbox.shift(); $('#notice').textContent = '';
    } catch (e) { $('#notice').textContent = 'Нет связи, повторю…'; await new Promise(z => setTimeout(z, 3000)); }
  }
  sending = false;
}
window.give = k => {
  const id = viewing; if (!id) return;
  const was = given[id];
  if (was === undefined) done++; else hist[was]--;
  hist[k] = (hist[k] || 0) + 1; given[id] = k;
  recent = recent.filter(x => x !== id).concat([id]);
  outbox.push({id, label: k}); pump();
  counters();
  if (id === cur) next(); else show(cur || id);
};
window.undo = () => {
  const id = recent[recent.length - 1]; if (!id) return;
  hist[given[id]]--; done--; delete given[id];
  recent.pop();
  outbox.push({id, label: null}); pump();
  if (cur) todo.unshift(cur);
  cur = id; show(id); counters();
};
window.back = () => {
  const k = recent.indexOf(viewing);
  const id = k > 0 ? recent[k - 1] : (k < 0 ? recent[recent.length - 1] : null);
  if (id) show(id);
};
window.fwd = () => {
  const k = recent.indexOf(viewing);
  if (k >= 0 && k < recent.length - 1) show(recent[k + 1]); else if (cur) show(cur);
};
window.plain = () => { noOutline = !noOutline; if (viewing) $('#crop').src = src(viewing); };
addEventListener('beforeunload', e => { if (outbox.length) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('keydown', ev => {
  const code = ev.code || '', k = /^Digit\d$/.test(code) ? code.slice(5) : /^Numpad\d$/.test(code) ? code.slice(6) : ev.key;
  if (/^[0-5]$/.test(k)) { give(+k); ev.preventDefault(); }
  else if (code === 'KeyH' || /^[hр]$/i.test(ev.key)) plain();
  else if (code === 'KeyZ' || /^[zя]$/i.test(ev.key)) undo();
  else if (ev.key === 'ArrowLeft') back();
  else if (ev.key === 'ArrowRight') fwd();
});
refill();
</script>
</body></html>
